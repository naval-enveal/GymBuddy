# Static analysis configuration for the GymBuddy Flutter app.
#
# Run with `flutter analyze`. CI treats any issue as a failure (see the M0 CI
# workflow). Lint rules are tuned to the conventions in CLAUDE.md — single
# quotes, const-correctness, and no stray prints in shipping code.
#
# Full lint catalogue: https://dart.dev/lints

include: package:flutter_lints/flutter.yaml

analyzer:
  # Treat the analyzer's stricter type modes as errors so loose typing can't
  # silently creep in as the codebase grows.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Missing-required-param and dead code are bugs, not style nits.
    missing_required_param: error
    dead_code: error
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Style — keep the codebase consistent and diff-friendly.
    prefer_single_quotes: true
    require_trailing_commas: true
    directives_ordering: true
    sort_pub_dependencies: true

    # Const-correctness — cheap wins for rebuild performance.
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_final_locals: true

    # Safety — surface foot-guns the default set leaves as info-level.
    avoid_print: true
    always_use_package_imports: true
    unawaited_futures: true
